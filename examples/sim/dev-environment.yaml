name: dev-environment
description: >-
  A development environment with traffic only while tests run (1–2 h bursts, then gaps of a day
  or more): outgoing calls plus a few webhook deliveries per burst. A fault inside a burst must
  alert; nothing may fire in the gaps; the webhook source is marked irregular (silence alerts off).
start: 2026-01-05T00:00:00Z
duration: 7d
seed: 3
environment: development
history: { mode: seeded, days: 22 }
providers:
  - name: PayCo
    host: api.payco.test
    endpoints:
      - method: POST
        path: /v1/charges
        traffic:
          pattern: test-bursts
          rate: 60
          burstMinutes: [60, 120]
          idleHours: [12, 36]
          schedule: [day 0 10:00, day 1 15:00, day 3 09:30, day 4 16:00, day 6 11:00]
        normal: { errors: 0.004, latencyMs: 250 }
webhooks:
  - provider: NotifyCo
    route: /webhooks/notifyco
    traffic:
      pattern: test-bursts
      rate: 0.5
      burstMinutes: [60, 120]
      idleHours: [12, 36]
      schedule: [day 0 10:05, day 1 15:05, day 3 09:35, day 4 16:05, day 6 11:05]
    normal: { rejected: 0.002, handlerMs: 60 }
faults:
  - id: errors-in-burst
    target: PayCo POST /v1/charges
    at: day 3 10:00
    duration: 30m
    type: 5xx
    size: 0.4
expect:
  - incident: { kind: errors, target: PayCo POST /v1/charges, fault: errors-in-burst, within: 10m }
  - quiet: { from: day 0, to: day 3 10:00 }
  - quiet: { from: day 3 11:30, to: day 7 }
  - irregular: { target: NotifyCo webhooks /webhooks/notifyco, by: day 0 01:00 }
