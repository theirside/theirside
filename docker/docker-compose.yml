# Dev/demo compose file for working on this repo: collector + Postgres, plus the demo and e2e
# profiles. Self-hosting users get docker/compose.selfhost.yml instead (what theirside.dev
# serves as /compose.yml); keep user-facing settings and comments there.
# Collector + Postgres from a released image (ghcr.io/theirside/collector):
#   THEIRSIDE_VERSION=0.6.3 docker compose -f docker/docker-compose.yml up -d
# Without docker/dev.env the first start generates the project API key and logs a one-time
# link to create the first account (docker compose -f docker/docker-compose.yml logs collector).
# A release version is pulled, never built: if the pull fails, or with --build, it stops
# with an error. THEIRSIDE_VERSION=local (the default; demo, dev, CI) builds the collector
# from this checkout as ghcr.io/theirside/collector:local, a tag that is never published.
# Demo stack (chaos provider, NestJS demo app, load generator), with the well-known dev key
# and admin token from docker/dev.env so its services can reach the collector:
#   docker compose --env-file docker/dev.env -f docker/docker-compose.yml --profile demo up
#
# Settings come from the shell or an env file: cp .env.example .env, edit it, then
#   docker compose --env-file .env -f docker/docker-compose.yml up -d
name: theirside

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: theirside
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-theirside-local-only}
      POSTGRES_DB: theirside
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U theirside -d theirside']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  collector:
    build:
      context: ..
      dockerfile: docker/Dockerfile.collector
      # the Dockerfile refuses to build anything but local (no silent source builds of a release)
      args:
        THEIRSIDE_VERSION: ${THEIRSIDE_VERSION:-local}
    image: ghcr.io/theirside/collector:${THEIRSIDE_VERSION:-local}
    # try the registry first; for local the pull finds nothing and compose builds
    pull_policy: missing
    environment:
      DATABASE_URL: postgres://theirside:${POSTGRES_PASSWORD:-theirside-local-only}@postgres:5432/theirside
      THEIRSIDE_DEPLOYMENT_MODE: self_hosted
      # both optional: unset, the first start generates the key and logs a setup link
      # (docs/security.md); set, they work as before 0.3.2
      THEIRSIDE_BOOTSTRAP_API_KEY: ${THEIRSIDE_BOOTSTRAP_API_KEY:-}
      THEIRSIDE_ADMIN_TOKEN: ${THEIRSIDE_ADMIN_TOKEN:-}
      THEIRSIDE_PUBLIC_URL: ${THEIRSIDE_PUBLIC_URL:-http://localhost:${COLLECTOR_PORT:-4318}}
      THEIRSIDE_LICENSE_KEY: ${THEIRSIDE_LICENSE_KEY:-}
      # user accounts (docs/nestjs-integration.md): 2FA key, proxy sign-in, load balancers
      THEIRSIDE_SECRET_KEY: ${THEIRSIDE_SECRET_KEY:-}
      THEIRSIDE_SECRET_KEY_PREVIOUS: ${THEIRSIDE_SECRET_KEY_PREVIOUS:-}
      THEIRSIDE_TRUST_PROXY: ${THEIRSIDE_TRUST_PROXY:-}
      THEIRSIDE_AUTH_PROXY: ${THEIRSIDE_AUTH_PROXY:-}
      THEIRSIDE_AUTH_PROXY_TRUSTED_IPS: ${THEIRSIDE_AUTH_PROXY_TRUSTED_IPS:-}
      THEIRSIDE_AUTH_PROXY_HEADER: ${THEIRSIDE_AUTH_PROXY_HEADER:-}
      THEIRSIDE_AUTH_PROXY_ALB_ARN: ${THEIRSIDE_AUTH_PROXY_ALB_ARN:-}
      THEIRSIDE_AUTH_PROXY_AUTO_CREATE: ${THEIRSIDE_AUTH_PROXY_AUTO_CREATE:-}
      THEIRSIDE_ADMIN_EMAILS: ${THEIRSIDE_ADMIN_EMAILS:-}
      # extra catalog entries for the demo's fake providers; they only match the reserved
      # .test TLD, so they never affect real traffic. Set it to empty to disable.
      THEIRSIDE_CATALOG_OVERRIDE: ${THEIRSIDE_CATALOG_OVERRIDE-/app/demo-catalog.json}
      # the #/design gallery (tokens and components) without sign-in, for designers and
      # screenshot checks; this compose file is the local/demo stack. Set it to 0 to hide it.
      THEIRSIDE_DESIGN_GALLERY: ${THEIRSIDE_DESIGN_GALLERY-1}
      # email alerts (see .env.example); empty = email channel disabled
      THEIRSIDE_SMTP_URL: ${THEIRSIDE_SMTP_URL:-}
      THEIRSIDE_SMTP_HOST: ${THEIRSIDE_SMTP_HOST:-}
      THEIRSIDE_SMTP_PORT: ${THEIRSIDE_SMTP_PORT:-}
      THEIRSIDE_SMTP_SECURE: ${THEIRSIDE_SMTP_SECURE:-}
      THEIRSIDE_SMTP_REQUIRE_TLS: ${THEIRSIDE_SMTP_REQUIRE_TLS:-}
      THEIRSIDE_SMTP_USER: ${THEIRSIDE_SMTP_USER:-}
      THEIRSIDE_SMTP_PASS: ${THEIRSIDE_SMTP_PASS:-}
      THEIRSIDE_SMTP_FROM: ${THEIRSIDE_SMTP_FROM:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '${COLLECTOR_PORT:-4318}:4318'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---- demo / e2e helpers -------------------------------------------------
  # Start them with --env-file docker/dev.env: their key and admin token must match the
  # collector's, and a zero-config collector makes up its own.

  # Fake providers (Acme Cards, KYCo, BankCo) + alert sink at /__alerts.
  chaos:
    profiles: ['demo', 'e2e']
    build:
      context: ..
      dockerfile: docker/Dockerfile.node-app
      args:
        PACKAGE: '@theirside/chaos-provider'
    image: theirside/chaos-provider:local
    environment:
      CHAOS_PORT: 4010
      SINK_SECRET: ${SINK_SECRET:-e2e-sink-secret-0123456789}
      # NotifyCo also sends webhooks to the demo app (in e2e there is no demo app: sends fail quietly).
      # Make them stop, arrive late, fail verification or be slow: PUT /__webhooks (docs/demo.md)
      WEBHOOK_TARGET: ${WEBHOOK_TARGET:-http://demo:3000/webhooks/notifyco}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-demo-webhook-secret}
      WEBHOOK_RATE_PER_MIN: ${WEBHOOK_RATE_PER_MIN:-30}
    ports:
      - '${CHAOS_PUBLISH_PORT:-4010}:4010'
    networks:
      default:
        # fake providers (several hosts for Acme Cards), plus an internal service and a
        # telemetry host the zero-config SDK must exclude; *.saasco.test is resolved in the demo app
        aliases:
          - api.acmecards.test
          - files.acmecards.test
          - sandbox.acmecards.test
          - api.kyco.test
          - api.bankco.test
          - api.notifyco.test
          - api.geoapi.test
          - ledger
          - o4501.ingest.sentry.io

  # NestJS demo app: @nestjs/axios HttpService + fetch, SDK + AWS X-Ray (local daemon stub).
  demo:
    profiles: ['demo']
    build:
      context: ..
      dockerfile: docker/Dockerfile.node-app
      args:
        PACKAGE: '@theirside/nestjs-demo'
    image: theirside/nestjs-demo:local
    environment:
      PORT: 3000
      THEIRSIDE_COLLECTOR_URL: http://collector:4318
      THEIRSIDE_API_KEY: ${THEIRSIDE_BOOTSTRAP_API_KEY:-}
      THEIRSIDE_ENVIRONMENT: demo
      # zero-config SDK: no provider list, see examples/nestjs-demo/src/instrumentation.ts
      SAASCO_TARGET: chaos
      # verifies NotifyCo's webhook signatures (the chaos provider signs with the same secret)
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-demo-webhook-secret}
    ports:
      - '${DEMO_PORT:-3000}:3000'
    depends_on:
      collector:
        condition: service_healthy
      chaos:
        condition: service_started
    restart: unless-stopped

  # One-shot: backfills 7 days of demo data on first start (docs/demo.md). Refuses
  # (exit 2) on anything that is not an empty demo install; no-op once seeded.
  demo-seed:
    profiles: ['demo']
    image: ghcr.io/theirside/collector:${THEIRSIDE_VERSION:-local}
    command: ['node', 'dist/demo-seed.js']
    environment:
      DATABASE_URL: postgres://theirside:${POSTGRES_PASSWORD:-theirside-local-only}@postgres:5432/theirside
      # refuses without docker/dev.env, so the demo can't start with keys that don't match
      DEMO_STACK: '1'
      THEIRSIDE_API_KEY: ${THEIRSIDE_BOOTSTRAP_API_KEY:-}
    depends_on:
      collector:
        condition: service_healthy
    restart: 'no'

  # Demo traffic: calls the NestJS demo app, and sets the demo up (alert sink, provider contacts).
  loadgen:
    profiles: ['demo']
    build:
      context: ..
      dockerfile: docker/Dockerfile.node-app
      args:
        PACKAGE: '@theirside/loadgen'
    image: theirside/loadgen:local
    environment:
      MODE: demo
      DEMO_URL: http://demo:3000
      RPS: ${RPS:-20}
      THEIRSIDE_COLLECTOR_URL: http://collector:4318
      THEIRSIDE_ADMIN_TOKEN: ${THEIRSIDE_ADMIN_TOKEN:-}
      SINK_URL: http://chaos:4010/__alerts
      SINK_SECRET: ${SINK_SECRET:-e2e-sink-secret-0123456789}
    depends_on:
      demo:
        condition: service_started
      demo-seed:
        condition: service_completed_successfully
    restart: unless-stopped

  # Phase 3 acceptance: SDK traffic, injected failure, alert assertions.
  #   docker compose --env-file docker/dev.env -f docker/docker-compose.yml --profile e2e up --build --abort-on-container-exit e2e
  e2e:
    profiles: ['e2e']
    build:
      context: ..
      dockerfile: docker/Dockerfile.node-app
      args:
        PACKAGE: '@theirside/loadgen'
    image: theirside/loadgen:local
    command: ['node', 'dist/e2e.js']
    environment:
      THEIRSIDE_COLLECTOR_URL: http://collector:4318
      THEIRSIDE_API_KEY: ${THEIRSIDE_BOOTSTRAP_API_KEY:-}
      THEIRSIDE_ADMIN_TOKEN: ${THEIRSIDE_ADMIN_TOKEN:-}
      CHAOS_URL: http://chaos:4010
      CHAOS_PORT: 4010
      SINK_SECRET: ${SINK_SECRET:-e2e-sink-secret-0123456789}
      WARMUP_MINUTES: ${WARMUP_MINUTES:-6}
      RPS: ${RPS:-30}
    depends_on:
      collector:
        condition: service_healthy
      chaos:
        condition: service_started

volumes:
  pgdata:
