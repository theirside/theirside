# Throwaway Postgres for the collector test suite (data on tmpfs).
#   docker compose -f docker/docker-compose.test.yml up -d --wait
name: theirside-test
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: theirside
      POSTGRES_PASSWORD: im
      POSTGRES_DB: im
    ports:
      - '127.0.0.1:54329:5432'
    tmpfs:
      - /var/lib/postgresql/data
    command:
      ['postgres', '-c', 'fsync=off', '-c', 'synchronous_commit=off', '-c', 'max_connections=200']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U im']
      interval: 1s
      timeout: 3s
      retries: 30
