# Collector image release: ghcr.io/theirside/collector, linux/amd64 + linux/arm64.
#   git tag v0.5.0 && git push origin v0.5.0
# or Actions → "Release collector image" → Run workflow (builds the selected ref).
# Tags: <version>; for a stable version also <major>.<minor> (if it is the newest patch of that
# minor) and latest (if it is the newest stable version overall, by git tags). A prerelease
# (0.2.0-rc.1) gets only <version>. docker/compose.selfhost.yml (what theirside.dev serves)
# pulls <major>.<minor>, so the self-host Quick start must pass before anything is pushed.
# Retag only (no build): Run workflow with "retag" ticked points <major>.<minor> and latest at
# the already-published <version>, under the same newest-version rules (e.g. a backfill).
name: Release collector image

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.2.0 or 0.3.0-rc.1 (builds the selected ref)'
        required: true
        type: string
      retag:
        description: 'Only point <major>.<minor> and latest at the published <version>; no build'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-collector-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/theirside/collector

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      minor: ${{ steps.v.outputs.minor }}
      move_minor: ${{ steps.v.outputs.move_minor }}
      move_latest: ${{ steps.v.outputs.move_latest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: v
        env:
          RAW: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          version="${RAW#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$RAW' is not a version like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          minor="${version%.*}"
          # newest stable versions from the git tags, this one included (a dispatch may not be tagged)
          stable="$( { git tag -l 'v*.*.*' | sed 's/^v//'; echo "$version"; } | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -uV)"
          move_minor=false
          move_latest=false
          if [ "$prerelease" = false ]; then
            [ "$(grep -E "^${minor//./\\.}\.[0-9]+$" <<<"$stable" | tail -1)" = "$version" ] && move_minor=true
            [ "$(tail -1 <<<"$stable")" = "$version" ] && move_latest=true
          fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "minor=$minor"
            echo "move_minor=$move_minor"
            echo "move_latest=$move_latest"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing $version (prerelease: $prerelease; $minor: $move_minor; latest: $move_latest)"

  test:
    name: Collector tests
    needs: version
    if: ${{ !inputs.retag }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: theirside
          POSTGRES_PASSWORD: im
          POSTGRES_DB: im
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U theirside -d im" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://theirside:im@127.0.0.1:54329/im
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm vitest run --project collector

  selfhost-quickstart:
    name: Self-host Quick start (compose.selfhost.yml)
    needs: version
    if: ${{ !inputs.retag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # the image this release pushes, built for the runner's arch and loaded locally
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.collector
          load: true
          tags: ghcr.io/theirside/collector:quickstart
          cache-from: type=gha
      - run: docker/selfhost-quickstart.sh ghcr.io/theirside/collector:quickstart

  publish:
    name: Build and push (amd64 + arm64)
    needs: [version, test, selfhost-quickstart]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # attest-build-provenance
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        env:
          # put the annotations on the multi-arch index too, so ghcr shows them
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          # <major>.<minor> and latest only move forward (see the version job)
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=raw,value=${{ needs.version.outputs.minor }},enable=${{ needs.version.outputs.move_minor == 'true' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.move_latest == 'true' }}
          # FCL is not on the SPDX list (LICENSING.md); GitHub can't detect it from LICENSE
          labels: |
            org.opencontainers.image.title=Theirside collector
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=LicenseRef-FCL-1.0-ALv2
          annotations: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=LicenseRef-FCL-1.0-ALv2
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.collector
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # BuildKit SLSA provenance and SPDX SBOM, attached to the image in the registry
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # GitHub artifact attestation (verify: gh attestation verify oci://ghcr.io/theirside/collector:<version> -R theirside/theirside).
      # Free for public repos; a private repo needs GitHub Enterprise Cloud, so it is skipped there.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Summary
        run: |
          {
            echo "### ${IMAGE}:${VERSION}"
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  retag:
    name: Retag published version (no build)
    needs: version
    if: ${{ inputs.retag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MINOR: ${{ needs.version.outputs.minor }}
      MOVE_MINOR: ${{ needs.version.outputs.move_minor }}
      MOVE_LATEST: ${{ needs.version.outputs.move_latest }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          tags=()
          [ "$MOVE_MINOR" = true ] && tags+=(-t "$IMAGE:$MINOR")
          [ "$MOVE_LATEST" = true ] && tags+=(-t "$IMAGE:latest")
          if [ ${#tags[@]} -eq 0 ]; then
            echo "::error::$VERSION is a prerelease or not the newest version of its line; nothing to retag"
            exit 1
          fi
          # copies the multi-arch index as is: same digest, signatures and attestations stay valid
          docker buildx imagetools create "${tags[@]}" "$IMAGE:$VERSION"
          docker buildx imagetools inspect "$IMAGE:$VERSION" | head -3
          echo "### ${IMAGE}:${VERSION} → ${tags[*]}" >> "$GITHUB_STEP_SUMMARY"
