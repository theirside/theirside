name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint + test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: theirside
          POSTGRES_PASSWORD: im
          POSTGRES_DB: im
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U im" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://theirside:im@127.0.0.1:54329/im
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # build first: the NestJS demo typechecks against the built SDK (as a real install would)
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # docs/site (published on theirside.dev): code blocks compile against the built SDK's
      # published types, front matter, generated configuration tables
      - run: pnpm docs:check
      - name: SDK compatibility smoke (built CJS + ESM)
        run: node packages/sdk/test-compat/run.cjs

  sdk-compat:
    name: SDK compatibility (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the oldest supported Node, the latest 18, and the exact 24 we develop on
        node: ['18.18.0', '18', '24.13.0']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @theirside/sdk build
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: SDK compatibility smoke (built CJS + ESM)
        run: node packages/sdk/test-compat/run.cjs

  sdk-runtimes:
    name: SDK on Bun and workerd (fetch-only entry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @theirside/sdk build
      # conditional exports + the Cloudflare Workers runtime (workerd via Miniflare, no nodejs_compat)
      - run: pnpm --filter @theirside/sdk test:runtimes
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: pnpm --filter @theirside/sdk test:bun

  sdk-soak:
    name: SDK memory soak, 5 min (collector ${{ matrix.collector }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        collector: [up, down]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @theirside/sdk build
      # fails on a clear upward heap trend; the 60-minute run is manual (docs/benchmarks.md)
      - run: pnpm --filter @theirside/soak soak:ci --collector ${{ matrix.collector }}

  # Alert quality (docs/benchmarks.md "Detection") runs in detection-ci.yml (every push)
  # and detection-weekly.yml (the full sweep).

  # The theirside.dev Quick start against docker/compose.selfhost.yml with this commit's image.
  # Release tags run the same check in release-collector.yml before anything is pushed.
  selfhost-quickstart:
    name: Self-host Quick start (compose.selfhost.yml)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.collector
          load: true
          tags: ghcr.io/theirside/collector:quickstart
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker/selfhost-quickstart.sh ghcr.io/theirside/collector:quickstart

  # The collector verifies its database's certificate against a custom CA
  # (THEIRSIDE_DATABASE_CA_FILE + sslmode=verify-full), and the image carries the RDS bundle.
  database-tls:
    name: Database TLS (self-signed CA)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.collector
          load: true
          tags: ghcr.io/theirside/collector:tls
          cache-from: type=gha
      - run: docker/database-tls-check.sh ghcr.io/theirside/collector:tls

  smoke:
    name: Playwright smoke (docker compose demo stack)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # no --wait: the one-shot demo-seed container exits by design; `up -d` already
      # waits for it to complete before starting loadgen, and for the collector's healthcheck
      - run: docker compose --env-file docker/dev.env -f docker/docker-compose.yml --profile demo up -d --build
        env:
          # a throwaway key so the smoke test can exercise two-factor sign-in
          THEIRSIDE_SECRET_KEY: ci-smoke-only-not-a-secret-0123456789
      - run: pnpm --filter @theirside/dashboard exec playwright install --with-deps chromium
      - run: pnpm --filter @theirside/dashboard smoke
        env:
          THEIRSIDE_ADMIN_TOKEN: change-me-admin-token
      - if: failure()
        run: docker compose -f docker/docker-compose.yml --profile demo logs --tail 200
