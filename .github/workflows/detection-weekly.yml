# The full 26-week detection sweep (docs/benchmarks.md "Detection"), once a week on main
# (Monday 02:17 UTC) or by hand (Actions → Run workflow). It takes over an hour on a
# standard runner, so releases don't wait for it; pushes and pull requests run the short
# `--ci` cells (detection-ci.yml). The table is kept as an artifact.
name: Detection bench (weekly)

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    name: Detection bench (full sweep)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sweep
        shell: bash # -eo pipefail: the bench's exit code survives tee
        run: pnpm bench:detect --markdown --explain | tee detection.md
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detection-sweep
          path: detection.md
