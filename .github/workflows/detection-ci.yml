# Detection bench, key profile × scenario cells with short runs and fixed seeds (`--ci`,
# under ~5 minutes), on pushes to main and on pull requests (once per PR update). The
# full 26-week sweep runs weekly (detection-weekly.yml) and locally (`pnpm bench:detect`).
name: Detection bench (CI cells)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  detection:
    name: Detection bench (CI cells)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bench:detect --ci
